<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envío de Volante de Pagos a n8n</title>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- SheetJS for Excel parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            background: linear-gradient(135deg, #a5b4fc, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .file-upload {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border: 2px dashed var(--border-color);
            border-radius: 1rem;
            background: rgba(15, 23, 42, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-upload:hover,
        .file-upload.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .file-upload input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .file-name {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-align: center;
            word-break: break-all;
        }

        .btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            opacity: 0.7;
        }

        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .status.success {
            display: block;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* Spinner animation */
        .spinner {
            display: none;
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            position: absolute;
            top: calc(50% - 0.75rem);
            left: calc(50% - 0.75rem);
        }

        .btn.loading {
            color: transparent;
        }

        .btn.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Envío a n8n</h1>
                <p>Sube tu volante de pagos en formato PDF o Excel</p>
            </div>

            <form id="uploadForm">

                <div class="form-group">
                    <label for="empresaSelect">Empresa</label>
                    <select id="empresaSelect" class="form-control" required>
                        <option value="" disabled selected>Selecciona una empresa</option>
                        <option value="1">Top Talent</option>
                        <option value="2">Artdecon</option>
                        <option value="3">Otra</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Archivo PDF o Excel</label>
                    <div class="file-upload" id="dropZone">
                        <div class="file-icon">📄</div>
                        <div class="file-name" id="fileName">Arrastra y suelta tu PDF o Excel aquí o haz clic para
                            seleccionar
                        </div>
                        <input type="file" id="pdfFile" accept="application/pdf, .xls, .xlsx" required>
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    Enviar Documento
                    <div class="spinner"></div>
                </button>
                <!-- <button type="button" class="btn" id="testBtn"
                    style="background-color: var(--card-bg); color: var(--primary); border: 1px solid var(--primary); margin-top: 0.5rem;">
                    Enviar JSON de Prueba
                    <div class="spinner" id="testSpinner"></div>
                </button> -->
            </form>

            <div id="statusMessage" class="status"></div>
        </div>
    </div>

    <script>
        // Configurar Worker de PDF.js
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('pdfFile');
        const fileNameDisplay = document.getElementById('fileName');
        const dropZone = document.getElementById('dropZone');
        const submitBtn = document.getElementById('submitBtn');
        // const testBtn = document.getElementById('testBtn');
        const statusMessage = document.getElementById('statusMessage');

        // Manejo visual de la carga de archivo
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                const fileExt = file.name.split('.').pop().toLowerCase();
                const isValid = file.type === 'application/pdf' ||
                    file.type === 'application/vnd.ms-excel' ||
                    file.type === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' ||
                    ['xls', 'xlsx'].includes(fileExt);
                if (!isValid) {
                    showStatus('Por favor, selecciona un archivo PDF o Excel (.xls, .xlsx) válido.', 'error');
                    fileInput.value = '';
                    fileNameDisplay.textContent = 'Arrastra y suelta tu PDF o Excel aquí o haz clic para seleccionar';
                } else {
                    fileNameDisplay.textContent = file.name;
                    hideStatus();
                }
            } else {
                fileNameDisplay.textContent = 'Arrastra y suelta tu PDF o Excel aquí o haz clic para seleccionar';
            }
        });

        // Eventos drag and drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                fileInput.files = files;
                fileInput.dispatchEvent(new Event('change'));
            }
        });

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status ${type}`;
        }

        function hideStatus() {
            statusMessage.className = 'status';
        }

        function parseVolantes(text) {
            let separator = "ARTDECON DE COLOMBIA S.A.S";
            let parts = text.split(separator);

            if (parts.length <= 1) {
                separator = "TOP TALENT IN ACTION SAS";
                parts = text.split(separator);
            }

            const result = [];

            for (let i = 1; i < parts.length; i++) {
                const chunk = separator + parts[i];
                try {
                    const volante = parseSingleVolante(chunk);
                    if (volante) result.push(volante);
                } catch (e) {
                    console.error("Error parseando un volante", e);
                }
            }
            return result;
        }

        function parseExcel(arrayBuffer) {
            console.log("parseExcel: Iniciando lectura del archivo...");
            const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];

            // Convertir la hoja a una matriz bidimensional (2D array)
            const data = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: null });
            console.log("parseExcel: Datos cargados del excel. Filas totales:", data.length);

            const volantes = [];
            const numRows = data.length;

            function cleanVal(val) {
                if (val === null || val === undefined) return "";
                return String(val).trim();
            }

            function formatNumber(val) {
                if (val === null || val === undefined || val === "") return "";
                const num = Math.abs(Number(val));
                if (isNaN(num)) return String(val).trim();

                // Formatear a separador de miles con punto (ej: 1.060.000)
                return num.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
            }

            const selectedEmpresaId = document.getElementById('empresaSelect').value;
            let r = 0;

            while (r < numRows) {
                const row = data[r] || [];

                // Buscar si esta fila contiene el nombre de alguna de las empresas
                let empresa = "";
                let empresaColIdx = -1;
                for (let c = 0; c < row.length; c++) {
                    const val = cleanVal(row[c]);
                    if (val.includes("TOP TALENT") || val.includes("ARTDECON")) {
                        empresa = val;
                        empresaColIdx = c;
                        break;
                    }
                }

                if (!empresa) {
                    r++;
                    continue;
                }

                const startRow = r;
                console.log("parseExcel: Encontrado inicio de bloque en fila " + startRow + " (" + empresa + ")");

                // El NIT está en la misma columna en la fila siguiente
                let nit = "";
                if (startRow + 1 < numRows) {
                    nit = cleanVal(data[startRow + 1][empresaColIdx]);
                    if (nit.toLowerCase().startsWith("nit.")) {
                        nit = nit.substring(4).trim();
                    }
                }

                // Función helper para buscar etiquetas en el bloque
                function getValueAfterLabel(labelText, maxSearch = 6) {
                    for (let offset = 1; offset < maxSearch; offset++) {
                        const currR = startRow + offset;
                        if (currR >= numRows) break;
                        const currRow = data[currR] || [];
                        for (let cIdx = 0; cIdx < currRow.length; cIdx++) {
                            const val = cleanVal(currRow[cIdx]);
                            if (val.toLowerCase().includes(labelText.toLowerCase())) {
                                // Buscar el primer valor no vacío después de esta etiqueta
                                for (let nextC = cIdx + 1; nextC < currRow.length; nextC++) {
                                    const nextVal = cleanVal(currRow[nextC]);
                                    if (nextVal !== "" && nextVal !== ":") {
                                        return nextVal;
                                    }
                                }
                            }
                        }
                    }
                    return "";
                }

                let periodo = getValueAfterLabel("Periodo");
                if (!periodo) {
                    periodo = getValueAfterLabel("Periodo Liq");
                }

                let concepto = "";
                if (startRow + 2 < numRows) {
                    concepto = cleanVal(data[startRow + 2][empresaColIdx]);
                }

                const contrato = getValueAfterLabel("Contrato");

                let nombre = "";
                if (startRow + 3 < numRows) {
                    nombre = cleanVal(data[startRow + 3][empresaColIdx]);
                }

                let documento = "";
                if (startRow + 4 < numRows) {
                    documento = cleanVal(data[startRow + 4][empresaColIdx]);
                    if (documento.endsWith(".0")) {
                        documento = documento.substring(0, documento.length - 2);
                    }
                }

                let dias = getValueAfterLabel("Dias Laborados");
                if (dias.endsWith(".0")) {
                    dias = dias.substring(0, dias.length - 2);
                }

                let isBono = false;
                let netoFormatted = "";
                const devengados = [];
                const deducidos = [];

                // Determinar si es BONO buscando "NETO A PAGAR" en startRow + 5
                if (startRow + 5 < numRows) {
                    const row5 = data[startRow + 5] || [];
                    for (let cIdx = 0; cIdx < row5.length; cIdx++) {
                        const val = cleanVal(row5[cIdx]);
                        if (val.toLowerCase().includes("neto a pagar")) {
                            isBono = true;
                            for (let nextC = cIdx + 1; nextC < row5.length; nextC++) {
                                const nextVal = row5[nextC];
                                if (nextVal !== null && nextVal !== undefined && String(nextVal).trim() !== "") {
                                    netoFormatted = formatNumber(nextVal);
                                    break;
                                }
                            }
                            break;
                        }
                    }
                }

                console.log("parseExcel: isBono=" + isBono + " para " + nombre);

                if (isBono) {
                    if (concepto && netoFormatted) {
                        devengados.push({
                            concepto: concepto,
                            valor: netoFormatted
                        });
                    }
                    r = startRow + 8; // Avanzar el bloque de 8 filas fijo del Bono
                } else {
                    // Es formato BÁSICO con tamaño de filas dinámico
                    let currR = startRow + 5;
                    let state = "init"; // init -> devengados -> deducidos -> neto -> done

                    while (currR < numRows && state !== "done") {
                        const rowData = data[currR] || [];

                        // Generar un string consolidado de la fila para verificar etiquetas
                        const rowStr = rowData.map(x => cleanVal(x)).join(" ").toLowerCase();

                        if (rowStr.includes("devengados") && !rowStr.includes("total")) {
                            state = "devengados";
                            currR += 2; // Saltar la fila "DEVENGADOS" y la cabecera "Conceptos / Valor Liquidado"
                            continue;
                        } else if (rowStr.includes("deducidos") && !rowStr.includes("total")) {
                            state = "deducidos";
                            currR += 1; // Saltar la fila "DEDUCIDOS"
                            continue;
                        } else if (rowStr.includes("neto a pagar")) {
                            for (let cIdx = 0; cIdx < rowData.length; cIdx++) {
                                if (cleanVal(rowData[cIdx]).toLowerCase().includes("neto a pagar")) {
                                    for (let nextC = cIdx + 1; nextC < rowData.length; nextC++) {
                                        const nextVal = rowData[nextC];
                                        if (nextVal !== null && nextVal !== undefined && String(nextVal).trim() !== "") {
                                            netoFormatted = formatNumber(nextVal);
                                            break;
                                        }
                                    }
                                    break;
                                }
                            }
                            state = "done";
                            currR += 1;
                            continue;
                        } else if (rowStr.includes("total devengado") || rowStr.includes("total deducido")) {
                            currR += 1;
                            continue;
                        }

                        // Parsear los conceptos dependiendo del estado actual
                        if (state === "devengados") {
                            const conceptName = cleanVal(rowData[0]);
                            let valLiquidado = "";
                            for (let cVal = rowData.length - 1; cVal >= 0; cVal--) {
                                const valStr = cleanVal(rowData[cVal]);
                                if (valStr !== "") {
                                    valLiquidado = formatNumber(rowData[cVal]);
                                    break;
                                }
                            }
                            console.log("parseExcel: [DEV] Fila " + currR + " -> concepto=" + conceptName + ", valor=" + valLiquidado);
                            if (conceptName && valLiquidado) {
                                devengados.push({
                                    concepto: conceptName,
                                    valor: valLiquidado
                                });
                            }
                        } else if (state === "deducidos") {
                            const conceptName = cleanVal(rowData[0]);
                            let valLiquidado = "";
                            for (let cVal = rowData.length - 1; cVal >= 0; cVal--) {
                                const valStr = cleanVal(rowData[cVal]);
                                if (valStr !== "") {
                                    valLiquidado = formatNumber(rowData[cVal]);
                                    break;
                                }
                            }
                            console.log("parseExcel: [DED] Fila " + currR + " -> concepto=" + conceptName + ", valor=" + valLiquidado);
                            if (conceptName && valLiquidado) {
                                deducidos.push({
                                    concepto: conceptName,
                                    valor: valLiquidado
                                });
                            }
                        }

                        currR++;
                    }
                    r = currR;
                }

                let idEmpresa = selectedEmpresaId;
                if (empresa.includes("TOP TALENT")) {
                    idEmpresa = "1";
                } else if (empresa.includes("ARTDECON")) {
                    idEmpresa = "2";
                }

                volantes.push({
                    id_empresa: idEmpresa,
                    empresa: empresa,
                    nit: nit,
                    periodoLiquidacion: periodo,
                    concepto: concepto,
                    empleadoNombre: nombre,
                    documento: documento,
                    contrato: contrato,
                    diasLaborados: dias,
                    netoAPagar: netoFormatted,
                    devengados: devengados,
                    deducidos: deducidos
                });
            }

            console.log(`parseExcel: Extracción finalizada. Se encontraron ${volantes.length} volantes.`);
            return volantes;
        }

        function parseSingleVolante(text) {
            const volante = {
                empresa: "",
                nit: "",
                periodoLiquidacion: "",
                concepto: "",
                empleadoNombre: "",
                documento: "",
                contrato: "",
                diasLaborados: "30",
                netoAPagar: "",
                devengados: [],
                deducidos: []
            };

            // Empresa y Nit
            if (text.includes("ARTDECON DE COLOMBIA S.A.S")) {
                volante.empresa = "ARTDECON DE COLOMBIA S.A.S";
            } else if (text.includes("TOP TALENT IN ACTION SAS")) {
                volante.empresa = "TOP TALENT IN ACTION SAS";
            }

            const nitMatch = text.match(/Nit\.\s*([\d\.\-]+)/i);
            if (nitMatch) volante.nit = nitMatch[1];

            // Periodo
            // Busca fechas tipo "1 - 30 de Abr de 2026" en cualquier parte del texto del volante
            const periodoMatch = text.match(/(\d{1,2}\s*-\s*\d{1,2}\s*de\s*[A-Za-z]+\.?\s*de\s*\d{4})/i);
            if (periodoMatch) {
                volante.periodoLiquidacion = periodoMatch[1].trim();
            } else {
                volante.periodoLiquidacion = "1 - 30 de Abr de 2026"; // Fallback en caso de no detectarlo
            }

            // Concepto Principal
            if (text.includes("Prima Extra-Legal no salarial")) {
                volante.concepto = "Prima Extra-Legal no salarial";
            } else if (text.includes("Bonificación")) {
                volante.concepto = "Bonificación";
            }

            // Contrato
            const contratoMatch = text.match(/(CT\s*\d+)/);
            if (contratoMatch) volante.contrato = contratoMatch[1];

            // Días Laborados
            const diasMatch = text.match(/Dias Laborados\s*[:]?\s*(\d+)/i);
            if (diasMatch) volante.diasLaborados = diasMatch[1];

            // Neto
            const netoMatch = text.match(/NETO A PAGAR\s*([\d\.]+)/);
            if (netoMatch) volante.netoAPagar = netoMatch[1];

            // Devengados y Deducidos dinámicos
            if (text.includes("Total Devengado")) {
                // Formato 2: TIRA DE PAGO BASICO
                const devMatch = text.match(/Conceptos\s*\n([\s\S]*?)Total Devengado/);
                if (devMatch) {
                    const lines = devMatch[1].trim().split('\n').map(l => l.trim()).filter(l => l !== '');
                    for (let j = 0; j < lines.length; j += 2) {
                        const concepto = lines[j];
                        const valorStr = lines[j + 1];
                        if (!valorStr) break;
                        const cleanVal = valorStr.replace(/[()]/g, '');
                        volante.devengados.push({ concepto, valor: cleanVal });
                    }
                }

                const dedMatch = text.match(/DEDUCIDOS\s*\n([\s\S]*?)Total Deducido/);
                if (dedMatch) {
                    const lines = dedMatch[1].trim().split('\n').map(l => l.trim()).filter(l => l !== '');
                    for (let j = 0; j < lines.length; j += 2) {
                        const concepto = lines[j];
                        const valorStr = lines[j + 1];
                        if (!valorStr) break;
                        const cleanVal = valorStr.replace(/[()]/g, '');
                        volante.deducidos.push({ concepto, valor: cleanVal });
                    }
                }
            } else {
                // Formato 1: TIRA DE PAGO BONO
                const blockMatch = text.match(/Deducidos\s*\n([\s\S]*?)NETO A PAGAR/);
                if (blockMatch) {
                    const lines = blockMatch[1].trim().split('\n').map(l => l.trim()).filter(l => l !== '');
                    if (lines.length >= 2) {
                        const parseAmount = (str) => parseInt(str.replace(/\./g, ''), 10);
                        const totalDeducidos = parseAmount(lines[0]);

                        let currentSum = 0;
                        for (let j = 2; j < lines.length; j += 2) {
                            const concepto = lines[j];
                            const valorStr = lines[j + 1];
                            if (!valorStr) break;

                            const valor = parseAmount(valorStr);
                            if (totalDeducidos > 0 && currentSum < totalDeducidos) {
                                volante.deducidos.push({ concepto, valor: valorStr });
                                currentSum += valor;
                            } else {
                                volante.devengados.push({ concepto, valor: valorStr });
                            }
                        }
                    }
                }
            }

            // Documento: formato X.XXX.XXX o XX.XXX.XXX o X.XXX.XXX.XXX o sin puntos
            // Buscamos todos los números largos y filtramos el NIT y los montos monetarios
            const allDocs = text.match(/\b([1-9]\d{0,2}(?:\.\d{3}){2,3}|[1-9]\d{6,10})\b/g);
            if (allDocs) {
                for (let d of allDocs) {
                    if (d.includes("900.621.056") || d.includes("900621056") || d === volante.netoAPagar) continue;

                    const isMonto = volante.devengados.some(dev => dev.valor === d) || volante.deducidos.some(ded => ded.valor === d);

                    if (!isMonto) {
                        volante.documento = d;
                        break;
                    }
                }
            }

            // Nombre del empleado (Heurística mejorada)
            // Buscar un patrón de 2 a 5 palabras TODAS en MAYÚSCULAS
            const nombreMatch = text.match(/\b([A-ZÑÁÉÍÓÚÄËÏÖÜ]{2,}(?:\s+[A-ZÑÁÉÍÓÚÄËÏÖÜ]{2,}){1,5})\b/g);
            if (nombreMatch) {
                for (let match of nombreMatch) {
                    // Ignoramos frases conocidas en mayúsculas que no son nombres
                    if (!match.includes("ARTDECON") && !match.includes("NETO A PAGAR") && !match.includes("DEVENGADOS") && !match.includes("DEDUCIDOS") && !match.includes("COLOMBIA")) {
                        volante.empleadoNombre = match.trim();
                        break;
                    }
                }
            }

            return volante;
        }

        // Envío de Prueba
        let isSubmitting = false;

        // Envío del formulario PDF/Excel
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isSubmitting) return;
            
            hideStatus();
 
            const webhookUrl = 'https://agentes.colchonessunmoon.com/webhook/325244a0-a4ed-437c-ae35-2f3c7b832940';
            const file = fileInput.files[0];
 
            if (!file) {
                showStatus('Por favor, selecciona un archivo.', 'error');
                return;
            }
 
            isSubmitting = true;
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            showStatus('Procesando archivo, extrayendo datos...', 'success');
 
            try {
                // Leer el archivo como ArrayBuffer
                const arrayBuffer = await file.arrayBuffer();
                let volantes = [];
 
                const fileExt = file.name.split('.').pop().toLowerCase();
                const isExcel = fileExt === 'xls' || fileExt === 'xlsx';
 
                if (isExcel) {
                    volantes = parseExcel(arrayBuffer);
                } else {
                    // Cargar el PDF con pdf.js
                    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                    const pdf = await loadingTask.promise;
 
                    let fullText = "";
 
                    // Extraer texto de todas las páginas
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join('\n');
                        fullText += pageText + "\n";
                    }
 
                    // Parsear los volantes
                    volantes = parseVolantes(fullText);
                }
 
                // Agregar el ID de empresa a cada volante si no fue autodetectado
                const idEmpresa = document.getElementById('empresaSelect').value;
                volantes.forEach(volante => {
                    if (!volante.id_empresa) {
                        volante.id_empresa = idEmpresa;
                    }
                });
 
                if (volantes.length === 0) {
                    showStatus('No se encontraron volantes válidos en el PDF.', 'error');
                    isSubmitting = false;
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('loading');
                    return;
                }
 
                showStatus(`Enviando ${volantes.length} volantes al servidor...`, 'success');
 
                // Enviar como JSON al webhook
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(volantes)
                });
 
                if (response.ok) {
                    showStatus(`¡Se enviaron ${volantes.length} volantes con éxito como JSON!`, 'success');
                    form.reset();
                    fileNameDisplay.textContent = 'Arrastra y suelta tu PDF o Excel aquí o haz clic para seleccionar';
                } else {
                    const errorText = await response.text();
                    showStatus(`Error del servidor: ${response.status} ${errorText.substring(0, 50)}`, 'error');
                }
            } catch (error) {
                console.error('Error procesando o enviando el documento:', error);
                showStatus('Error al procesar el archivo. Revisa la consola para más detalles.', 'error');
            } finally {
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
            }
        });
    </script>
</body>
